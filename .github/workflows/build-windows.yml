name: Build Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    # audioplayers 6.7.x requires the Visual Studio 2022 toolchain.
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Check Flutter toolchain
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Read app version
        id: app-version
        shell: pwsh
        run: |
          $match = Get-Content pubspec.yaml | Select-String '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+\s*$'
          if (-not $match) {
            throw 'Could not read the app version from pubspec.yaml.'
          }
          "version=$($match.Matches.Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Build Windows release
        run: flutter build windows --release

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Vitalinguu-${{ steps.app-version.outputs.version }}-windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
